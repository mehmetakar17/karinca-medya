name: Trendyol veri
on:
  push:
    branches: [arsiv]
    paths: ['arsiv/trendyol/p1154499985/yorum/urls.tsv']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yorum fotograflari
        run: |
          cd arsiv/trendyol/p1154499985/yorum
          while IFS=$'\t' read -r f u; do [ -z "$f" ] && continue; curl -fsSL -m 60 -A "Mozilla/5.0" -o "$f" -w "$f %{http_code} %{size_download}\n" "$u" || { echo "$f fail"; rm -f "$f"; }; done < urls.tsv
      - name: Kaydet
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f arsiv/trendyol; git commit -m "Trendyol yorum fotograflari" || true; git pull -q --rebase || true; git push
