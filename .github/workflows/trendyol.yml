name: Trendyol veri
on:
  push:
    branches: [arsiv]
    paths: ['arsiv/trendyol/**/urls.tsv']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fotograflar (her urls.tsv klasorune; eksik olanlari indirir)
        run: |
          for t in $(find arsiv/trendyol -name urls.tsv); do
            d=$(dirname "$t")
            while IFS=$'\t' read -r f u; do [ -z "$f" ] && continue; [ -s "$d/$f" ] && continue
              curl -fsSL -m 60 -A "Mozilla/5.0" -o "$d/$f" -w "$d/$f %{http_code} %{size_download}\n" "$u" || { echo "$d/$f fail"; rm -f "$d/$f"; }
            done < "$t"
          done
      - name: Kaydet
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f arsiv/trendyol; git commit -m "Trendyol fotograflari" || true; git pull -q --rebase || true; git push
